# .github/workflows/ansible-lint.yml
name: ansible-lint
on:
  push:
    branches: ["main"]
jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main # or vX.X.X version
        # optional (see below):
        with:
          args: ""
          gh_action_ref: "<override_version>"
          setup_python: "true"
          python_version: "3.14"
          working_directory: ""
          requirements_file: ""
